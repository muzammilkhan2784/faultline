services:
  neo4j:
    image: neo4j:5-community
    container_name: faultline_neo4j
    environment:
      NEO4J_AUTH: neo4j/faultline-dev
      # Neo4j's defaults are small; a 90k-LOC ingest is noticeably slower without these.
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      target: production
    container_name: faultline_api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: faultline-dev
      ALLOWED_ROOT: /repos
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      # Mount a directory of local repos here to analyse them by path.
      - ${FAULTLINE_REPOS:-./.repos}:/repos:ro
    depends_on:
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: faultline_web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  neo4j_data:
