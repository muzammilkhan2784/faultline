<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Faultline maps a Python codebase into a call graph and shows what breaks when you change a function."
    />
    <title>Faultline</title>
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var forced = new URLSearchParams(location.search).get("theme");
        var saved = (forced === "dark" || forced === "light") ? forced : localStorage.getItem("faultline-theme");
        var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? "light" : "dark");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
