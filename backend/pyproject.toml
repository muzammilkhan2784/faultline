[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.1.0"
description = "Code impact analyzer for Python repositories — maps a codebase into a graph and answers 'what breaks if I change this?'"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muzammilkhan Pathan" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "neo4j>=5.23.0,<6",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
faultline = "faultline.cli:main"

[tool.setuptools.packages.find]
include = ["faultline*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]
extend-exclude = ["tests/fixtures", ".cache"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # use pathlib
    "RET",           # return style
    "ARG",           # unused arguments
]
ignore = [
    "B008",    # FastAPI Depends() in defaults is the documented idiom
    "RUF012",  # ClassVar annotations not required for our simple constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002", "E501"]
"tests/fixtures/**" = ["ALL"]
"benchmarks/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
exclude = ["tests/fixtures/", "build/", ".cache/"]

[[tool.mypy.overrides]]
module = ["neo4j.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".venv", "build", ".cache", "*.egg-info"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live Neo4j instance",
    "accuracy: resolution-accuracy harness (requires Neo4j + network)",
]
filterwarnings = ["error::DeprecationWarning:faultline.*"]

[tool.coverage.run]
source = ["faultline"]
omit = ["faultline/cli.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
